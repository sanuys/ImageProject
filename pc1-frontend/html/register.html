<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมัครสมาชิก</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <span class="brand">🖼️ Text-to-Image Studio</span>
    <div class="nav-right" id="nav-right" style="display:none;"></div>
  </nav>

  <div class="container">
    <div id="flash-area"></div>

    <div class="auth-box">
      <h2>สมัครสมาชิก</h2>
      <form id="register-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <label for="confirm">ยืนยัน Password</label>
        <input type="password" id="confirm" name="confirm" required>

        <button type="submit" class="btn-primary">สมัครสมาชิก</button>
      </form>
      <p class="switch-link">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

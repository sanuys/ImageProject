# ============================================================
#  PC1 : NGINX (Reverse Proxy + Static Web Server)
#  10.187.226.36 : 80
# ------------------------------------------------------------
#  browser ยิงมาที่เครื่องนี้เครื่องเดียว แล้ว Nginx กระจายงานต่อ:
#     /            -> ไฟล์ static (HTML/CSS/JS) บนเครื่องนี้
#     /api/        -> Backend Flask ที่ PC2 (10.187.226.226:5000)
#     /media/      -> ไฟล์ภาพที่เก็บอยู่บนเครื่อง PC2
#
#  ข้อดีของการ proxy แบบนี้: browser มองเห็นทุกอย่างเป็น origin
#  เดียวกัน (http://10.187.226.36) จึงไม่ต้องตั้ง CORS และ session
#  cookie ทำงานได้ตามปกติ
# ============================================================

upstream backend_pc2 {
    server 172.20.56.107:5000;   # <— แก้เป็น IP จริงของเครื่อง Backend
}

server {
    listen       80;
    # _ = รับทุก hostname/IP ที่ยิงเข้าเครื่องนี้
    # ใช้ _ แทนการระบุ IP ตรง ๆ เพราะเน็ต CDTI แจก IP แบบ DHCP
    # ถ้า IP เครื่องนี้เปลี่ยน ไฟล์นี้ไม่ต้องแก้ (ปัจจุบัน 10.187.226.36)
    server_name  _;

    charset utf-8;
    client_max_body_size 32M;   # เผื่ออัปโหลดภาพใหญ่ในแท็บแก้ไขภาพ

    access_log  logs/imageproject.access.log;
    error_log   logs/imageproject.error.log;

    # ---------- 1) หน้าเว็บ static บนเครื่องนี้ ----------
    location / {
        root  "C:\image\ImageProject\pc1-frontend\html";   # <— แก้เป็น path จริงบนเครื่อง PC1
        index  index.html;
        try_files $uri $uri/ =404;
    }

    # ---------- 2) API -> Backend ที่ PC2 ----------
    location /api/ {
        proxy_pass         http://backend_pc2;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # การสร้างภาพใช้เวลานาน (GPU) ต้องยืด timeout ไม่งั้นจะเจอ 504 ทั้งที่ภาพกำลังสร้างอยู่
        proxy_connect_timeout  60s;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;

        proxy_buffering off;   # ให้ผลลัพธ์ไหลกลับทันทีไม่ต้องรอ buffer เต็ม
    }

    # ---------- 3) ไฟล์ภาพ -> เก็บอยู่ที่ PC2 ----------
    location /media/ {
        proxy_pass         http://backend_pc2;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_read_timeout 120s;

        # ภาพที่สร้างแล้วไม่เปลี่ยนอีก ให้ browser cache ไว้เลย ลดโหลดฝั่ง PC2
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ---------- 4) cache ไฟล์ static ----------
    location ~* \.(css|js)$ {
        root         "C:\image\ImageProject\pc1-frontend\html";
        expires      1h;
        add_header Cache-Control "public";
    }
}

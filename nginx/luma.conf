# Nginx reverse proxy config for the LUMA distributed system (see project.pdf).
#
# NOT tested against a live Nginx install (none available in this dev environment) —
# this is a scaffold matching the architecture in project.pdf page 1. Verify with
# `nginx -t` on the actual reverse-proxy machine, then reload with `nginx -s reload`.
#
# Layout it assumes (adjust the two `server` addresses for your team's actual IPs —
# see the 3-PC / 4-PC examples on page 2 of project.pdf):
#   Frontend  : 192.168.1.10 (HTML/CSS/JS, currently served by Flask on port 5000)
#   Backend   : 192.168.1.20 (Flask API, port 5000)
#   AI Server : 192.168.1.30 (Forge, not proxied directly — only Backend talks to it)

upstream luma_frontend {
    server 192.168.1.10:5000;
}

upstream luma_backend {
    server 192.168.1.20:5000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;  # /api/edit and /api/png-info accept image uploads

    # API + auth + admin -> Flask backend
    location ~ ^/(api/|login|logout|register|admin) {
        proxy_pass http://luma_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # /api/generate can take a while
    }

    # Generated/edited images -> currently stored on the backend host under static/
    location /static/outputs/ {
        proxy_pass http://luma_backend;
        proxy_set_header Host $host;
    }

    # Everything else -> frontend
    # NOTE: as of this commit, frontend and backend are still one Flask process
    # (see TODO.md section 1 — frontend has not been extracted into its own
    # static host yet). Until that split happens, point both upstreams at the
    # same backend machine, or run this file only after the split is done.
    location / {
        proxy_pass http://luma_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
